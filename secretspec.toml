[project]
name = "logos"
revision = "1.0"

[providers]
dop = { uri = "doppler://logos/prd", credentials = { token = "keyring" } }
keyring = "keyring://"

[scopes.sops]
secrets = ["SOPS_AGE_KEY"]

[profiles.default.defaults]
providers = ["dop"]

[profiles.default]
SOPS_AGE_KEY = { description = "age secret key for SOPS", required = true }
