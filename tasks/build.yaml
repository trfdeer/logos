version: "3"

tasks:
  image:
    desc: Build system image
    requires:
      vars: [OUTPUT, TYPE]
    cmds:
      - nix build ".#nixosConfigurations.{{.OUTPUT}}.config.system.build.{{.TYPE}}" {{.CLI_ARGS}}

  lxc:
    desc: Build LXC container image tarball
    requires:
      vars: [OUTPUT]
    cmds:
      - task: image
        vars:
          TYPE: tarball

  iso:
    desc: Build ISO image
    requires:
      vars: [OUTPUT]
    cmds:
      - task: image
        vars:
          TYPE: isoImage

  wsl:
    desc: Build WSL tarball
    requires:
      vars: [OUTPUT]
    cmds:
      - task: image
        vars:
          TYPE: tarballBuilder
