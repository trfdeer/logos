version: "3"

vars:
  SECRET_FILES: identities devices sshHosts outConfig
  DECRYPTED_DIR: secrets/decrypted

tasks:
  init:
    desc: Decrypt and initialize secrets
    vars:
      AGE_KEY:
        sh: op read op://sqwer/sqwer_age/password
    cmds:
      - echo 'Initializing secrets...'
      - git config core.hooksPath ".githooks"
      - rm -rf "{{.DECRYPTED_DIR}}"
      - mkdir -p "{{.DECRYPTED_DIR}}"
      - |
        for file in {{.SECRET_FILES}}; do
          echo '→ decrypting '"$file"'.json'
          SOPS_AGE_KEY={{.AGE_KEY}} sops \
            --output "{{.DECRYPTED_DIR}}/$file.json" \
            -d "secrets/$file.json"
        done
      - find "{{.DECRYPTED_DIR}}" -type f -exec git add -fN {} \;
      - echo 'Done'

  edit:
    desc: Open encrypted file with sops
    vars:
      AGE_KEY:
        sh: op read op://sqwer/sqwer_age/password
    cmds:
      - SOPS_AGE_KEY={{.AGE_KEY}} sops {{.CLI_ARGS}}

  clean:
    desc: Remove generated files
    cmds:
      - echo 'Cleaning secrets...'
      - rm -rf "{{.DECRYPTED_DIR}}"
